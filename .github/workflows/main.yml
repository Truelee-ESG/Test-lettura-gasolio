name: Crea Eseguibile .exe

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Carica il codice del repository
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    . - name: Installa le dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install pypdf pdfplumber pyinstaller
        
    - name: Compila con PyInstaller
      run: |
        pyinstaller --onefile --noconsole main.py

    - name: Salva il file .exe come Artifact
      uses: actions/upload-artifact@v4
      with:
        name: estrattore-fatture-exe
        path: dist/main.exe
